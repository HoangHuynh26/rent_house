[build]
  command = "npm run build"
  publish = "frontend/dist"
  functions = "backend/netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "backend/netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["sharp"]

# 1. Chuyển tiếp toàn bộ API sang Netlify Serverless Function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200
  force = true

# 2. Chuyển tiếp tệp tĩnh tải lên sang function Express
[[redirects]]
  from = "/uploads/*"
  to = "/.netlify/functions/api/uploads/:splat"
  status = 200
  force = true

# 3. Cấu hình SPA: Mọi route giao diện chuyển tiếp về index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
