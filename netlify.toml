[build]
  command = "npm run build"
  publish = "frontend/dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "backend/netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["pdfkit"]
  included_files = [
    "google-apps-script/Code.gs",
    "frontend/public/googlece2476463a9f3baa.html",
    "frontend/public/robots.txt",
    "frontend/public/sitemap.xml",
    "frontend/public/logo.png",
    "frontend/public/favicon-48x48.png",
    "frontend/public/favicon.ico",
    "frontend/public/og-image.png"
  ]

[functions."monthly-billing"]
  schedule = "0 3 10 * *"

# Proxy API requests to Netlify Functions backend
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Proxy uploaded files to Netlify Functions backend
[[redirects]]
  from = "/uploads/*"
  to = "/.netlify/functions/api/uploads/:splat"
  status = 200
  force = true

# Proxy health endpoint to Netlify Functions backend
[[redirects]]
  from = "/health"
  to = "/.netlify/functions/api/health"
  status = 200
  force = true

# SPA Fallback for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
