services:
  # 1. Express Backend Service
  - type: web
    name: nhatrothanhtam-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://nhatrothanhtam.netlify.app
      - key: COOKIE_SAMESITE
        value: none
      - key: COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: ADMIN_COOKIE_SECRET
        sync: false
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: nhatrothanhtam-ai
          property: host

  # 2. Python AI Meter Reading Microservice
  - type: web
    name: nhatrothanhtam-ai
    env: python
    plan: free
    rootDir: ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
